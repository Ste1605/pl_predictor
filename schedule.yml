name: Update Premier League Scores

on:
  schedule:
    # Runs automatically every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests gspread google-auth pandas tenacity

      - name: Run Score Update Script
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python update_scores.py
